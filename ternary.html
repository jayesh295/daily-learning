<script>

    let marks = Number(prompt("Enter your marks" , ""));
    (marks >= 90 && marks <= 100) ? alert('A') :
    (marks >= 80 && marks <= 89) ? alert('B') :
    (marks >= 70 && marks <= 79) ? alert('C') :
    (marks >= 60 && marks <= 69) ? alert('D') :
    (marks >= 0 && marks <= 59) ? alert('fail') : alert("Invalid marks");
    
</script>
